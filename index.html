<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yapper — Your people, your place</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#0b0b12;--panel:#141421;--line:#2b2a40;--text:#f5f4ff;--muted:#a5a2bd;--accent:#a78bfa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#34205c 0,transparent 40%),var(--bg);color:var(--text);font:15px system-ui;min-height:100vh;display:grid;place-items:center;padding:20px}.shell{width:min(1050px,100%);min-height:650px;display:grid;grid-template-columns:260px 1fr;background:var(--panel);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 25px 90px #0007}.side{padding:24px;border-right:1px solid var(--line)}h1{margin:0;font-size:28px;letter-spacing:-1px}.sub{color:var(--muted);margin:6px 0 25px}.rooms button,button{cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:#8b5cf6;color:white;font-weight:700}.rooms button{display:block;width:100%;text-align:left;background:transparent;color:var(--muted);margin:5px 0}.rooms button.active,.rooms button:hover{background:#29213e;color:white}.main{display:flex;flex-direction:column;min-width:0}.top{padding:22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.messages{padding:22px;flex:1;overflow:auto;min-height:350px}.msg{padding:12px 14px;border-radius:14px;background:#211f32;margin:10px 0;max-width:85%;overflow-wrap:anywhere}.msg b{display:block;color:#c4b5fd;font-size:12px;margin-bottom:4px}.composer{padding:18px;border-top:1px solid var(--line);display:flex;gap:10px}.composer input{flex:1;min-width:0}input{background:#0d0d17;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);width:100%;margin:5px 0 12px}label{font-size:12px;color:var(--muted)}.auth{max-width:440px;margin:auto;padding:30px;width:100%}.auth h2{margin-top:0}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.status{font-size:12px;color:#c4b5fd;margin-top:12px;overflow-wrap:anywhere}@media(max-width:650px){.shell{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:16px}.rooms{display:flex;gap:5px}.rooms button{width:auto}.main{min-height:60vh}.messages{min-height:250px}}
</style></head><body><section class="shell"><aside class="side"><h1>💬 Yapper</h1><p class="sub">Your people, your place.</p><div id="roomArea" class="rooms hidden"><p class="muted">PUBLIC ROOMS</p><button class="active" data-room="lobby"># lobby</button><button data-room="gaming"># gaming</button><button data-room="memes"># memes</button></div><p class="muted">A friendly realtime chat space.</p><div id="status" class="status">Sign in to start chatting.</div></aside><main class="main"><div id="auth" class="auth"><h2>Welcome to Yapper</h2><p class="muted">Sign in or create an account to join the conversation.</p><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="At least 6 characters"><button id="signup">Create account</button> <button id="signin">Sign in</button><p class="muted">New accounts may need to confirm their email first.</p></div><div id="chat" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0"><header class="top"><div><strong id="roomTitle"># lobby</strong><div class="muted" id="who">Signed in</div></div><button id="logout">Sign out</button></header><div id="messages" class="messages"></div><form id="sendForm" class="composer"><input id="message" maxlength="4000" placeholder="Say something nice…" required autocomplete="off"><button>Send</button></form></div></main></section>
<script>
(()=>{const URL="https://stofcbzyuxvkycjmxudk.supabase.co",KEY="sb_publishable_1Ty8tV50WY7sebzVlKRgjg_I4gyigDt",db=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);let user=null,room="lobby",roomId=null,channel=null;
function status(s){$("status").textContent=s}
function showChat(u){user=u;$("auth").classList.add("hidden");$("chat").classList.remove("hidden");$("roomArea").classList.remove("hidden");$("who").textContent=u.email||"Signed in";status("Connected. Loading rooms…");loadRoom()}
async function auth(mode){const email=$("email").value.trim(),password=$("password").value;if(!email||!password)return status("Enter an email and password first.");const r=mode==="signup"?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});if(r.error)return status(r.error.message);if(r.data.user&&!r.data.session&&mode==="signup")return status("Account created. Check your email to confirm, then sign in.");if(r.data.user)showChat(r.data.user)}
$("signup").onclick=()=>auth("signup");$("signin").onclick=()=>auth("signin");
$("logout").onclick=async()=>{await db.auth.signOut();if(channel)await db.removeChannel(channel);user=null;$("chat").classList.add("hidden");$("auth").classList.remove("hidden");$("roomArea").classList.add("hidden");$("messages").innerHTML="";status("Signed out.")};
document.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>{room=b.dataset.room;document.querySelectorAll("[data-room]").forEach(x=>x.classList.toggle("active",x===b));loadRoom()});
function addMessage(m){const el=document.createElement("div");el.className="msg";const name=document.createElement("b");name.textContent=m.sender_id===user?.id?"You":"Yapper · "+String(m.sender_id||"").slice(0,8);const body=document.createElement("div");body.textContent=m.content||"";el.append(name,body);$("messages").append(el);$("messages").scrollTop=$("messages").scrollHeight}
async function loadRoom(){if(!user)return;if(channel)await db.removeChannel(channel);$("roomTitle").textContent="# "+room;$("messages").innerHTML="";const rr=await db.from("rooms").select("id,name").eq("name",room).maybeSingle();if(rr.error||!rr.data){roomId=null;status("Couldn't load room: "+(rr.error?.message||"room not found"));return}roomId=rr.data.id;const r=await db.from("messages").select("*").eq("room_id",roomId).is("recipient_id",null).order("created_at",{ascending:true}).limit(100);if(r.error){status("Couldn't load messages: "+r.error.message);return}r.data.forEach(addMessage);channel=db.channel("room-"+roomId).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages",filter:"room_id=eq."+roomId},p=>{if(p.new.room_id===roomId&&p.new.recipient_id===null)addMessage(p.new)}).subscribe();status("In #"+room)}
$("sendForm").onsubmit=async e=>{e.preventDefault();const content=$("message").value.trim();if(!content||!user||!roomId)return;const r=await db.from("messages").insert({room_id:roomId,sender_id:user.id,content});if(r.error){status("Could not send: "+r.error.message);return}$("message").value=""};
(async()=>{const r=await db.auth.getSession();if(r.data.session)showChat(r.data.session.user);else status("Ready — sign in to begin.")})();
})();
</script></body></html>
